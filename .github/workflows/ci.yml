name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check SQLite FTS5 trigram support
        run: |
          python - <<'PY'
          import sqlite3
          connection = sqlite3.connect(":memory:")
          connection.execute("CREATE VIRTUAL TABLE t USING fts5(x, tokenize='trigram')")
          print("SQLite", sqlite3.sqlite_version, "supports FTS5 trigram")
          PY

      - name: Compile sources
        run: python -m compileall -q support_knowledge_engine scripts tests

      # The suite includes the 13-case baseline and 84-case corpus pilot
      # evaluations, which run against fictional PDFs only.
      - name: Run tests
        run: python -m unittest discover -s tests -v
